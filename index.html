<title>Plotting Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --ground:#D9D8CB; --surface:#E7E6DB; --sunk:#C6C5B5;
  --ink:#23261F; --ink-soft:#565948; --ink-faint:#84866F;
  --rule:#8A8974; --ochre:#A9762A; --danger:#8C3A2B;
  --fd:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --fb:"IBM Plex Sans",Arial,sans-serif;
  --fm:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#15170F; --surface:#1D2017; --sunk:#111309;
  --ink:#E0E1D4; --ink-soft:#A1A48F; --ink-faint:#74775F;
  --rule:#565A46; --ochre:#DCA945; --danger:#D8735C;
}}
:root[data-theme="dark"]{
  --ground:#15170F; --surface:#1D2017; --sunk:#111309;
  --ink:#E0E1D4; --ink-soft:#A1A48F; --ink-faint:#74775F;
  --rule:#565A46; --ochre:#DCA945; --danger:#D8735C;
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--fb);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding-inline:16px; padding-block:40px;}
.gate{width:100%; max-width:392px; background:var(--surface);
  border:1px solid var(--rule); padding:26px 22px}
h1{font-family:var(--fd); font-size:29px; text-transform:uppercase; letter-spacing:.05em;
  margin:0; line-height:1}
.sub{font-family:var(--fm); font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--ink-faint); margin-top:5px}
.rule{height:2px; background:var(--ink); margin:15px 0 17px}
label{font-family:var(--fm); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-soft); display:block; margin-bottom:6px}
input[type=password]{width:100%; font-family:var(--fm); font-size:14px; padding:9px 10px;
  background:var(--sunk); color:var(--ink); border:1px solid var(--rule)}
input[type=password]:focus{outline:2px solid var(--ochre); outline-offset:1px}
.remember{display:flex; align-items:center; gap:7px; margin-top:11px;
  font-size:12px; color:var(--ink-soft)}
button{width:100%; margin-top:15px; font-family:var(--fm); font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:600;
  background:var(--ink); color:var(--surface); border:1px solid var(--ink);
  padding:10px; cursor:pointer}
button:hover:not(:disabled){background:var(--ochre); border-color:var(--ochre); color:#1B1B12}
button:disabled{opacity:.5; cursor:progress}
.msg{font-family:var(--fm); font-size:11px; margin-top:11px; min-height:1.4em; color:var(--danger)}
.msg.working{color:var(--ink-faint)}
.note{font-family:var(--fm); font-size:10px; color:var(--ink-faint); line-height:1.6;
  margin-top:17px; padding-top:13px; border-top:1px solid var(--rule)}
</style>

<div class="gate">
  <h1>Plotting Table</h1>
  <div class="sub">Encrypted &middot; passphrase required</div>
  <div class="rule"></div>
  <form id="f">
    <label for="pw">Passphrase</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus
           spellcheck="false" enterkeyhint="go">
    <div class="remember">
      <input type="checkbox" id="remember">
      <label for="remember" style="margin:0; font-family:var(--fb); font-size:12px;
        letter-spacing:0; text-transform:none; color:var(--ink-soft)">Remember on this device</label>
    </div>
    <button type="submit" id="go">Unlock</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="note">The page is encrypted with AES-256-GCM. The passphrase never
     leaves this device and is not stored on the server &mdash; it derives the key
     here, in your browser.</p>
</div>

<script>
"use strict";
const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
const KEY_STORE = "plotting-table-pass";
const msg = document.getElementById("msg");
const go = document.getElementById("go");
const pw = document.getElementById("pw");

const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function unlock(passphrase){
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:bytes(PAYLOAD.salt), iterations:PAYLOAD.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  // GCM authenticates the ciphertext, so a wrong passphrase throws here
  // rather than yielding garbage.
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:bytes(PAYLOAD.iv)}, key, bytes(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function reveal(html){
  document.open();
  document.write(html);
  document.close();
}

async function attempt(passphrase, remember){
  if(!passphrase){ msg.textContent = "Enter the passphrase."; return false; }
  go.disabled = true;
  msg.className = "msg working";
  msg.textContent = "Deriving key\u2026";
  await new Promise(r => setTimeout(r, 16));
  try {
    const html = await unlock(passphrase);
    if(remember){ try { localStorage.setItem(KEY_STORE, passphrase); } catch(e){} }
    reveal(html);
    return true;
  } catch(err){
    try { localStorage.removeItem(KEY_STORE); } catch(e){}
    msg.className = "msg";
    msg.textContent = "That passphrase does not unlock this page.";
    go.disabled = false;
    pw.select();
    return false;
  }
}

document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  attempt(pw.value, document.getElementById("remember").checked);
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch(e){}
  if(saved){
    document.getElementById("remember").checked = true;
    await attempt(saved, true);
  }
})();
</script>
